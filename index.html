<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>台股產業趨勢儀表板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header"><div><p class="eyebrow">TWSE WATCHLIST</p><h1>台股產業趨勢儀表板</h1><p id="as-of">載入市場資料中…</p></div><button id="reload" type="button">重新載入資料</button></header>
  <main>
    <section class="summary-grid" aria-label="本週摘要"><article><span>本週最強</span><strong id="strongest">—</strong></article><article><span>本週最弱</span><strong id="weakest">—</strong></article><article><span>監測板塊</span><strong id="coverage">—</strong></article></section>
    <section class="panel"><div class="section-heading"><div><p class="eyebrow">WEEKLY RANKING</p><h2>板塊本週表現</h2></div><p>點選列查看成分股</p></div><div id="ranking" class="ranking" role="list"></div></section>
    <section class="detail-grid"><article class="panel"><div class="section-heading"><div><p class="eyebrow">SELECTED SECTOR</p><h2 id="selected-title">—</h2></div><strong id="selected-return">—</strong></div><div id="trend" class="trend" aria-label="本週累積報酬率趨勢"></div></article><article class="panel"><div class="section-heading"><div><p class="eyebrow">HOLDINGS</p><h2>成分股</h2></div><p id="selected-day">—</p></div><div id="holdings" class="holdings"></div></article></section>
    <section class="panel"><div class="section-heading"><div><p class="eyebrow">BENCHMARKS</p><h2>基準 ETF</h2></div><p>不納入板塊排名</p></div><div id="benchmarks" class="benchmark-grid"></div></section>
  </main>
  <footer>資料來源：臺灣證券交易所每日成交資訊。僅供資料整理，不構成投資建議。</footer>
  <script src="app.js"></script>
</body>
</html>
